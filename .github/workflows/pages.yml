name: Test and deploy

# Publishes the Vite dist at /GreekVisualizer/.
# Pages is still "Deploy from a branch", and the token here cannot switch it
# to GitHub Actions. _config.yml is invalid YAML so that Jekyll publisher fails
# instead of replacing this artifact with the repository source index.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check Pages base path
        run: node scripts/check-dist.mjs
      - name: Check the legacy Jekyll publisher still fails
        run: node scripts/check-legacy-pages.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test the production build
        run: npm run test:e2e
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
